name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Info ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          MAJOR_VERSION=$(echo "$JAVA_VER_OUTPUT" | sed -E 's/.*version "([0-9]+).*/\1/')

          if [ -z "$MAJOR_VERSION" ] || ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not detect active Java major version from: $JAVA_VER_OUTPUT"
            exit 1
          fi

          echo "Detected Java Major Version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Active Java version ($MAJOR_VERSION) is lower than the required Java 17."
            exit 1
          fi
          echo "Java 17+ environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            if [ ! -f "./debug.keystore" ]; then
              echo "::error::Failed to generate ./debug.keystore"
              exit 1
            fi
            echo "Temporary debug keystore generated successfully."
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK file not found at $EXPECTED_APK"
            echo "Searching within app/build/outputs/apk directory:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::The generated APK file is empty: $EXPECTED_APK"
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::The file does not have .apk extension: $EXPECTED_APK"
            exit 1
          fi

          echo "APK verified successfully: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$TEMP_RELEASE_DIR"

          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME="app"
          fi

          SANITIZED_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9_-]/-/g' -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')
          if [ -z "$SANITIZED_NAME" ]; then
            SANITIZED_NAME="app"
          fi

          ASSET_FILENAME="${SANITIZED_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_RELEASE_DIR}/${ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"

          if [ ! -s "$DEST_PATH" ]; then
            echo "::error::Failed to copy release asset to $DEST_PATH"
            exit 1
          fi

          echo "Prepared release asset: $DEST_PATH"
          echo "asset_path=${DEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          RELEASE_ASSET="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$RELEASE_ASSET" ] || [ ! -s "$RELEASE_ASSET" ] || [[ "$RELEASE_ASSET" != *.apk ]]; then
            echo "::error::Invalid release asset file: $RELEASE_ASSET"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES_BODY=$(cat <<'EOF'
          ### 🤖 Automated Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Build Run Number:** `${{ github.run_number }}`
          - **Build Run Attempt:** `${{ github.run_attempt }}`
          - **Source Commit:** `${{ github.sha }}`

          > ⚠️ **Note:** This APK is intended for testing and development only. It is not a production release and is signed using a temporary debug keystore.
          EOF
          )

          gh release create "$TAG_NAME" "$RELEASE_ASSET" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES_BODY" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "=========================================="
            echo "  GitHub Release Published Successfully   "
            echo "=========================================="
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Asset Filename: $ASSET_NAME"
            
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}")
            echo "Release URL: $RELEASE_URL"

            {
              echo "### 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "✅ **Release Published Successfully!**"
              echo ""
              echo "- **Release Page:** [View Release]($RELEASE_URL)"
              echo "- **Direct Asset:** \`$ASSET_NAME\`"
              echo "- **Release Tag:** \`$TAG_NAME\`"
              echo ""
              echo "📱 You can download the APK directly from the **Assets** section on the release page."
              echo "📦 The standard Actions artifact (\`app-debug-apk\`) is also preserved as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was not completed or encountered an issue."
            echo "The debug APK was built successfully and is preserved as a GitHub Actions artifact: app-debug-apk"

            {
              echo "### ⚠️ Debug APK Build Summary"
              echo ""
              echo "✅ **APK Build Succeeded!**"
              echo "⚠️ **GitHub Release Publishing Notice:** The release could not be published automatically, but your APK is safe."
              echo ""
              echo "📦 **Download Backup Artifact:** The verified debug APK is available in the **Artifacts** section of this workflow run named \`app-debug-apk\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
